name: release

# Push a tag like v2.0.0 and this builds the setup EXEs on a GitHub-hosted Windows runner
# and publishes them as a GitHub release. No local credentials or Visual Studio needed.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'cannot derive version from tag' }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version: $version"

      - name: Build provider and run the self check
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test.ps1 -Arch x64

      - name: Self check diagnostics
        if: failure()
        shell: pwsh
        run: |
          # Surface the test log in the run summary: job logs are not readable without
          # authentication, the summary is.
          $summary = $env:GITHUB_STEP_SUMMARY
          "## self check failed" | Out-File $summary -Append -Encoding utf8
          foreach ($f in @('_test\run.txt', '_test\cfg-dump.txt', '_test\cfg-dump.txt.err', '_test\install\provider-native.log')) {
            if (Test-Path $f) {
              "### $f" | Out-File $summary -Append -Encoding utf8
              '```' | Out-File $summary -Append -Encoding utf8
              Get-Content $f -Tail 40 | Out-File $summary -Append -Encoding utf8
              '```' | Out-File $summary -Append -Encoding utf8
            }
          }
          "### environment" | Out-File $summary -Append -Encoding utf8
          '```' | Out-File $summary -Append -Encoding utf8
          "pwsh      : $($PSVersionTable.PSVersion)" | Out-File $summary -Append -Encoding utf8
          "os        : $((Get-CimInstance Win32_OperatingSystem).Caption)" | Out-File $summary -Append -Encoding utf8
          "out dir   : $(if (Test-Path 'out\x64') { (Get-ChildItem 'out\x64' | ForEach-Object { $_.Name + '=' + $_.Length }) -join ', ' } else { 'missing' })" | Out-File $summary -Append -Encoding utf8
          '```' | Out-File $summary -Append -Encoding utf8

      - name: Build setup (x64)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-installer.ps1 -Arch x64 -Version $env:VERSION

      - name: Build setup (x86)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-installer.ps1 -Arch x86 -Version $env:VERSION

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter '*.exe' | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

          $notes = "docs/RELEASE-NOTES-$env:VERSION.md"
          if (Test-Path $notes) {
            Copy-Item $notes dist/release-notes.md
            Write-Host "release notes: $notes"
          } else {
            "ADCS CDBRP Provider $env:VERSION" | Set-Content -Path dist/release-notes.md -Encoding utf8
            Write-Host "release notes: generated fallback (no $notes)"
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Converge instead of create-only: re-running a tag must not fail just because the
          # release already exists (that is what broke the run right after the rename).
          $tag    = "v$env:VERSION"
          $title  = "ADCS CDBRP Provider $env:VERSION"
          $notes  = 'dist/release-notes.md'
          $assets = @(Get-ChildItem dist -Filter '*.exe' | ForEach-Object { $_.FullName })
          $assets += (Join-Path 'dist' 'SHA256SUMS.txt')

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists - converging it"
            gh release edit $tag --title $title --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }

            $wanted = @(Get-ChildItem dist -Filter '*.exe' | ForEach-Object { $_.Name }) + 'SHA256SUMS.txt'
            foreach ($name in (gh release view $tag --json assets --jq '.assets[].name')) {
              if ($wanted -notcontains $name) {
                Write-Host "  removing stale asset $name"
                gh release delete-asset $tag $name --yes
              }
            }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
          } else {
            gh release create $tag --title $title --notes-file $notes --latest @assets
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
          }
          gh release view $tag --json name,assets --jq '"released " + .name + " -> " + ([.assets[].name] | join(", "))'
